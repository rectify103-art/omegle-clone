<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectify chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="onlineUsers" style="display: flex; color: green;" >Online: 0</div>

    <div class="chat-container" >

        <div class="top-bar" >
            <h2>Rectify Chat</h2>
            <span id="status" >Waiting for stranger...</span>
        </div>

        <div id="chat" class="chat-box" ></div>

        <div id="typing" class="typing-indicator" ></div>

        <div class="input-area">
            <input
            type="text"
            id="msg"
            placeholder="Type a message..."
            autocomplete="off"
            >

            <button id="send" >
                Send
            </button>
        </div>

        <div class="action-buttons" >
            <button id="next" class="next-btn">
                Next Stranger
            </button>

            <button id="clear" class="clear-btn" >
                Clear Chat
            </button>
        </div>


    </div>

        <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>    <script src="/omegle-clone/client/script.js" ></script>
        <script src="script.js"></script>
</body>
</html>
